[General]
Autosave = 1
DisplayPerfInTitle = 0
ExtendedAspectRatio = 4:3
DisableFrameDelay = 0

[Graphics]
WindowSize = Auto
Fullscreen = 1
WindowScale = 3
NewRenderer = 1
EnhancedMode7 = 1
IgnoreAspectRatio = 0
NoSpriteLimits = 1
OutputMethod = SDL
LinearFiltering = 0
Shader =
DimFlashes = 0

# Change the appearance of Link by loading a ZSPR file
# See all sprites here: https://snesrev.github.io/sprites-gfx/snes/zelda3/link/
# Download the files with "git clone https://github.com/snesrev/sprites-gfx.git"
LinkGraphics = alt-sprites/link/sheets/botw-link.1.zspr

[Sound]
EnableAudio = 1
AudioFreq = 44100
AudioChannels = 2
AudioSamples = 1024
EnableMSU = false
MSUPath = msu/alttp_msu-
ResumeMSU = 1
MSUVolume = 100%

[Features]
ItemSwitchLR = 1
ItemSwitchLRLimit = 1
TurnWhileDashing = 1
MirrorToDarkworld = 1
CollectItemsWithSword = 1
BreakPotsWithSword = 1
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 1
ShowMaxItemsInYellow = 1
MoreActiveBombs = 1
CarryMoreRupees = 1
MiscBugFixes = 1
GameChangingBugFixes = 0
CancelBirdTravel = 1

[KeyMap]
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v

Turbo = Tab
ReplayTurbo = t

Load = F1, F2, F3, F4, F5, F6, F7, F8, F9, F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10

[GamepadMap]
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
